<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Svitlo Chain</title>
<meta name="description" content="Svitlo Chain — a decentralized GPU cloud for AI, secured by blockchain. Choose your language.">
<link rel="stylesheet" href="/assets/platform.css">
<style>
  .lang-hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .lang-hero .brand-mark{font-family:var(--serif);font-size:22px;font-weight:700;margin-bottom:28px;display:flex;align-items:center;gap:9px;}
  .lang-hero .brand-mark .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);}
  .lang-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:420px;width:100%;margin-top:34px;}
  @media (max-width:480px){.lang-grid{grid-template-columns:1fr;}}
  .lang-card{
    display:flex;align-items:center;gap:12px;padding:18px 20px;border-radius:14px;
    text-decoration:none;color:var(--ink);font-weight:700;font-size:16px;
    transition:transform .15s;
  }
  .lang-card:hover{transform:translateY(-2px);}
  .lang-card .flag{font-size:22px;}
</style>
</head>
<body>
<div class="lang-hero atmosphere">
  <div class="brand-mark"><span class="dot"></span>Svitlo<b style="color:var(--brown)">Chain</b></div>
  <div class="eyebrow">Decentralized GPU cloud</div>
  <h1 style="max-width:16ch">Choose your language</h1>
  <p class="lede center" style="margin-top:8px">Select a language to continue to the Svitlo Chain platform.</p>
  <div class="lang-grid">
    <a class="lang-card glass" href="/en/"><span class="flag">🇬🇧</span> English</a>
    <a class="lang-card glass" href="/uk/"><span class="flag">🇺🇦</span> Українська</a>
    <a class="lang-card glass" href="/sv/"><span class="flag">🇸🇪</span> Svenska</a>
    <a class="lang-card glass" href="/no/"><span class="flag">🇳🇴</span> Norsk</a>
  </div>
  <div style="margin-top:40px;font-size:13px;color:var(--ink-m);display:flex;gap:18px">
    <a href="/privacy/">Wallet privacy policy</a>
    <a href="/support/">Wallet support</a>
  </div>
</div>
<script>
(function(){
  var saved = null;
  try { saved = localStorage.getItem('svitlo-lang'); } catch (e) {}
  var supported = ['en','uk','sv','no'];
  if (saved && supported.indexOf(saved) !== -1) { location.replace('/' + saved + '/'); return; }
  // No saved preference yet -- intentionally NOT auto-redirecting on first visit
  // based on navigator.language; let the user pick once. Their choice is then
  // remembered (see template.mjs's per-page script) for next time.
})();
</script>
</body>
</html>
